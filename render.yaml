# Optional Render Blueprint. Uses the Gemini free-tier API; no paid API key is configured here.
services:
  - type: web
    name: khilji-personal-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AGENT_TRIAL_DAYS
        value: "30"
      - key: AGENT_DAILY_AI_SECONDS
        value: "600"
      - key: AGENT_TOKEN
        generateValue: true
      - key: AGENT_ENABLE_RUN_PYTHON
        value: "0"
      - key: AGENT_TRUST_PROXY
        value: "1"
      - key: AGENT_EPHEMERAL_STORAGE
        value: "1"
# Free Render storage is ephemeral: the 30-day trial start and daily usage counter
# can reset if the service filesystem is wiped. For a persistent trial/cap, attach
# a persistent disk and set AGENT_DATA_DIR=/data (paid storage/instance may apply).
